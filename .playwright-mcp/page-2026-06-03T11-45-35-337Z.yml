          - generic [ref=e1249]:
            - heading "Next.js Docs" [level=1] [ref=e1250]
            - paragraph [ref=e1251]: Welcome to the Next.js documentation!
            - heading "What is Next.js?Link to this section" [level=2] [ref=e1252]:
              - text: What is Next.js?
              - link "Link to this section" [ref=e1253] [cursor=pointer]:
                - /url: "#what-is-nextjs"
            - paragraph [ref=e1254]: Next.js is a React framework for building full-stack web applications. You use React Components to build user interfaces, and Next.js for additional features and optimizations.
            - paragraph [ref=e1255]: It also automatically configures lower-level tools like bundlers and compilers. You can instead focus on building your product and shipping quickly.
            - paragraph [ref=e1256]: Whether you're an individual developer or part of a larger team, Next.js can help you build interactive, dynamic, and fast React applications.
            - heading "How to use the docsLink to this section" [level=2] [ref=e1257]:
